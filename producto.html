<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Detalle de producto — The Camping." />
  <title>Producto · The Camping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css?v=20260918-1612" />
  <link rel="stylesheet" href="css/product.css?v=20260918-1612" />
</head>
<body class="product-body">
  <div class="product-shell">
    <header class="product-hero">
      <img id="productImage" class="product-hero__image" alt="" />
      <div class="product-hero__shade"></div>

      <div class="product-topbar">
        <a class="round-control" href="index.html" aria-label="Volver">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </a>

        <div class="product-topbar__actions">
          <button id="shareButton" class="round-control" type="button" aria-label="Compartir">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/></svg>
          </button>

          <button id="favoriteButton" class="round-control" type="button" aria-label="Favorito">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          </button>
        </div>
      </div>

      <button class="gallery-pill" type="button" aria-label="Ver galería">
        <span class="gallery-pill__icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 19"/></svg>
        </span>
        <span>Ver galería</span>
      </button>
    </header>

    <main class="product-sheet">
      <div class="product-sheet__handle" aria-hidden="true"></div>

      <section class="product-intro">
        <span id="productCategory" class="product-category">Camping</span>
        <h1 id="productTitle">Producto</h1>

        <div class="product-facts">
          <span class="fact-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.4-4.2 6-.9L12 3Z"/></svg>
            <span id="productRating">4.5</span>
          </span>

          <span class="fact-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v11H3z"/><path d="M14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <span id="deliveryShort">Entrega rápida</span>
          </span>
        </div>

        <div class="social-row">
          <div class="buyers-cluster">
            <span class="buyer-avatars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span id="productBuyers" class="buyers-count">0+</span>
          </div>
          <button class="reviews-link" type="button" id="reviewsButton">Ver reseñas</button>
        </div>
      </section>

      <section class="detail-section">
        <h2>Sobre este producto</h2>
        <p id="productDescription"></p>
        <button id="readMoreButton" class="inline-link" type="button">Leer más</button>
      </section>

      <section class="seller-section">
        <h2>Vendido por</h2>
        <div class="seller-row">
          <div class="seller-identity">
            <div class="seller-avatar">TC</div>
            <div>
              <strong>The Camping</strong>
              <span>Tienda oficial</span>
            </div>
          </div>

          <div class="seller-actions">
            <button type="button" aria-label="Consultar por teléfono">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
            </button>
            <button type="button" aria-label="Enviar mensaje">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z"/><path d="M8 10h8M8 14h5"/></svg>
            </button>
          </div>
        </div>
      </section>

      <section class="delivery-section">
        <div>
          <h2>Entrega</h2>
          <p id="deliveryLabel">Envíos disponibles</p>
        </div>
        <button class="inline-link" type="button">Ver condiciones</button>
      </section>

      <section class="features-section">
        <h2>Qué incluye</h2>
        <div id="featureGrid" class="feature-list"></div>
      </section>
    </main>

    <div class="purchase-bar">
      <div class="purchase-price">
        <span>Precio total</span>
        <strong id="productPrice"></strong>
        <small id="oldPrice"></small>
      </div>

      <button id="addToCart" class="buy-button" type="button">Comprar ahora</button>
    </div>

    <div id="toast" class="toast product-toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/data/catalog.js?v=20260918-1612"></script>
  <script src="js/product.js?v=20260918-1612"></script>
</body>
</html>
