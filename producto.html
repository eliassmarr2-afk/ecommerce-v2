<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f5d46" />
  <meta name="description" content="Detalle de producto — The Camping." />
  <title>Producto · The Camping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/product.css" />
</head>
<body>
  <div class="product-page">
    <header class="product-hero">
      <img id="productImage" class="product-hero__image" alt="" />
      <div class="product-hero__overlay"></div>

      <div class="product-topbar">
        <a class="floating-button" href="index.html" aria-label="Volver al inicio">←</a>
        <div class="product-topbar__actions">
          <button id="shareButton" class="floating-button" type="button" aria-label="Compartir">↗</button>
          <button id="favoriteButton" class="floating-button" type="button" aria-label="Guardar en favoritos">♡</button>
        </div>
      </div>

      <span id="productBadge" class="hero-product-badge"></span>
    </header>

    <main class="product-sheet">
      <div class="product-sheet__handle" aria-hidden="true"></div>

      <section class="product-intro">
        <span id="productCategory" class="product-category"></span>
        <h1 id="productTitle">Producto</h1>
        <p id="productSubtitle" class="product-subtitle-large"></p>

        <div class="product-meta-row">
          <span id="productRating" class="rating-pill">★ 4.5</span>
          <span id="productReviews" class="muted-meta"></span>
          <span class="meta-dot">•</span>
          <span id="productStock" class="stock-meta"></span>
        </div>

        <div class="buyers-row">
          <span class="buyer-avatars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="productBuyers"></span>
        </div>
      </section>

      <section class="commerce-card">
        <div class="price-copy">
          <span id="oldPrice" class="old-price-large"></span>
          <div class="current-price-row">
            <strong id="productPrice"></strong>
            <span id="discountBadge" class="discount-pill"></span>
          </div>
          <span id="installments" class="installments-copy"></span>
        </div>

        <div class="delivery-card">
          <span class="delivery-card__icon">↗</span>
          <div>
            <strong>Entrega estimada</strong>
            <span id="deliveryLabel"></span>
          </div>
        </div>
      </section>

      <section class="product-section">
        <div class="section-title-row">
          <h2>Acerca del producto</h2>
        </div>
        <p id="productDescription" class="description-copy"></p>
      </section>

      <section class="product-section">
        <div class="section-title-row">
          <h2>Qué incluye</h2>
        </div>
        <div id="featureGrid" class="feature-grid"></div>
      </section>

      <section class="product-section trust-section">
        <div class="trust-item">
          <span>✓</span>
          <div>
            <strong>Compra simple</strong>
            <small>Interfaz preparada para integrar checkout y CRM.</small>
          </div>
        </div>
        <div class="trust-item">
          <span>↗</span>
          <div>
            <strong>Entrega visible</strong>
            <small>El plazo estimado se informa antes de avanzar.</small>
          </div>
        </div>
      </section>
    </main>

    <div class="purchase-bar">
      <div class="quantity-control" aria-label="Cantidad">
        <button id="decreaseQty" type="button" aria-label="Restar una unidad">−</button>
        <span id="quantityValue">1</span>
        <button id="increaseQty" type="button" aria-label="Sumar una unidad">+</button>
      </div>
      <button id="addToCart" class="buy-button" type="button">
        <span>Agregar al carrito</span>
        <strong id="barPrice"></strong>
      </button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/data/catalog.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
