<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E2741" />
  <meta name="description" content="Ingresar o crear una cuenta en The Camping." />
  <title>Ingresar · The Camping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css?v=20260920-1218" />
  <link rel="stylesheet" href="css/auth.css?v=20260920-1218" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section id="authWelcome" class="auth-welcome" aria-label="Acceso a The Camping">
      <img class="auth-welcome__image" src="file_000000000e28820eb79d718ccb3845b1.png" alt="" />
      <div class="auth-welcome__shade" aria-hidden="true"></div>

      <a class="auth-back-home" href="index.html" aria-label="Volver al inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>

      <div class="auth-access-panel">
        <button id="openLoginButton" class="auth-access-button auth-access-button--primary" type="button">
          <span class="auth-access-button__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg>
          </span>
          <span>Ingresar</span>
        </button>

        <button id="googleLoginButton" class="auth-access-button auth-access-button--google" type="button">
          <span class="auth-google-mark" aria-hidden="true">G</span>
          <span>Continuar con Google</span>
        </button>

        <button id="createAccountButton" class="auth-access-button auth-access-button--secondary" type="button">
          Crear cuenta
        </button>
      </div>

      <div class="auth-welcome__brand">
        <span>THE CAMPING</span>
        <strong>Tu próxima salida empieza acá.</strong>
      </div>
    </section>

    <section id="authLogin" class="auth-login-screen" aria-labelledby="loginTitle" hidden>
      <div class="auth-login-hero">
        <img src="file_000000000e28820eb79d718ccb3845b1.png" alt="" />
        <div class="auth-login-hero__shade" aria-hidden="true"></div>

        <button id="backToWelcome" class="auth-login-back" type="button" aria-label="Volver">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>

      <section class="auth-login-card">
        <div class="auth-login-card__handle" aria-hidden="true"></div>

        <div class="auth-login-heading">
          <span>THE CAMPING</span>
          <h1 id="loginTitle">Ingresar</h1>
          <p>Accedé a tu cuenta para continuar.</p>
        </div>

        <form id="loginForm" class="auth-login-form" novalidate>
          <div class="auth-field">
            <label for="loginEmail">Correo electrónico</label>
            <div class="auth-control">
              <span class="auth-control__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              <input
                id="loginEmail"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="tu@email.com"
              />
            </div>
            <span id="loginEmailError" class="auth-field-error" hidden></span>
          </div>

          <div class="auth-field">
            <label for="loginPassword">Contraseña</label>
            <div class="auth-control">
              <span class="auth-control__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <input
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Tu contraseña"
              />
              <button id="togglePassword" class="auth-password-toggle" type="button" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
            <span id="loginPasswordError" class="auth-field-error" hidden></span>
          </div>

          <button id="forgotPassword" class="auth-forgot" type="button">¿Olvidaste tu contraseña?</button>

          <button class="auth-submit" type="submit">Ingresar</button>
        </form>

        <div class="auth-divider"><span>o</span></div>

        <button id="googleLoginCardButton" class="auth-card-google" type="button">
          <span class="auth-google-mark" aria-hidden="true">G</span>
          <span>Continuar con Google</span>
        </button>

        <p class="auth-create-copy">
          ¿Todavía no tenés una cuenta?
          <button id="createAccountInline" type="button">Crear cuenta</button>
        </p>
      </section>
    </section>

    <div id="authToast" class="auth-toast" role="status" aria-live="polite"></div>
  </main>

  <script src="js/auth.js?v=20260920-1218"></script>
  <script src="js/support-session-widget.js?v=20260920-1218"></script>
</body>
</html>
