<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ededed" />
  <meta name="description" content="The Camping — equipamiento para camping, verano y escapadas." />
  <title>The Camping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css?v=20260919-1510" />
  <link rel="stylesheet" href="css/home.css?v=20260919-1510" />
</head>
<body class="home-page">
  <div class="app-shell">
    <header class="home-header">
      <div class="location-row">
        <details id="homeMenu" class="home-menu-native">
          <summary class="menu-button" aria-label="Abrir menú">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </summary>

          <aside class="home-menu-panel" aria-labelledby="menuTitle">
            <div class="side-menu__top">
              <div>
                <span class="side-menu__eyebrow">THE CAMPING</span>
                <h2 id="menuTitle">Menú</h2>
              </div>
              <button id="closeMenuButton" class="side-menu__close" type="button" aria-label="Cerrar menú">×</button>
            </div>

            <nav class="side-menu__nav" aria-label="Menú de The Camping">
              <a class="side-menu__primary-link" href="index.html">Inicio</a>

              <div class="side-menu__group side-menu__group--static">
                <div class="side-menu__group-title">Categorías</div>
                <div id="menuCategories" class="side-menu__subnav"></div>
              </div>

              <a class="side-menu__primary-link" href="seguimiento.html">Rastreá tu compra</a>
              <a class="side-menu__primary-link" href="soporte.html">Contactá con soporte</a>

              <div class="side-menu__group side-menu__group--static">
                <div class="side-menu__group-title">Políticas</div>
                <div class="side-menu__subnav">
                  <button type="button" data-menu-placeholder="Política de privacidad">Privacidad</button>
                  <button type="button" data-menu-placeholder="Política de envío">Envíos</button>
                  <button type="button" data-menu-placeholder="Política de devolución">Devoluciones</button>
                  <button type="button" data-menu-placeholder="Política de compra">Compra</button>
                </div>
              </div>
            </nav>

            <div class="side-menu__footer">
              <span>Equipamiento para salir.</span>
              <strong>The Camping</strong>
            </div>
          </aside>
        </details>

        <div class="location-copy">
          <span class="micro-label">Ubicación</span>
          <button class="location-button" type="button" aria-label="Cambiar ubicación">
            <span class="pin-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>
            </span>
            <span>Buenos Aires, Argentina</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
          </button>
        </div>

        <button class="notification-button" type="button" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span class="notification-dot" aria-hidden="true"></span>
        </button>
      </div>

      <div class="search-row">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="searchInput" type="search" placeholder="Buscar productos, categorías..." autocomplete="off" />
        </label>

        <button id="filterButton" class="filter-button" type="button" aria-label="Abrir filtros">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/>
            <path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="home-main">
      <section class="categories-section" aria-labelledby="categoriesTitle">
        <div class="section-heading">
          <h2 id="categoriesTitle">Categorías</h2>
          <button id="resetCategories" class="see-all-button" type="button">Ver todas</button>
        </div>
        <div id="categoriesTrack" class="categories-track" aria-label="Categorías"></div>
      </section>

      <section class="products-section" aria-labelledby="featuredTitle">
        <div class="section-heading">
          <h2 id="featuredTitle">Destacados</h2>
          <button class="see-all-button" type="button" data-reset-view>Ver todos</button>
        </div>
        <div id="productsGrid" class="product-rail"></div>
      </section>

      <section class="products-section nearby-section" aria-labelledby="nearbyTitle">
        <div class="section-heading">
          <h2 id="nearbyTitle">Más elegidos</h2>
          <button class="see-all-button" type="button" data-category-jump="combos">Ver combos</button>
        </div>
        <div id="nearbyGrid" class="nearby-list"></div>
      </section>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-state__icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        </div>
        <h3>No encontramos productos</h3>
        <p>Probá con otra búsqueda o quitá los filtros.</p>
        <button id="clearFilters" class="primary-button" type="button">Limpiar filtros</button>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a class="bottom-nav__item is-active" href="index.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        <span>Inicio</span>
      </a>

      <button class="bottom-nav__item" type="button" data-placeholder-tab="Novedades">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.1 5.1L19 10l-4.9 1.9L12 17l-2.1-5.1L5 10l4.9-1.9L12 3Z"/></svg>
        <span>Novedades</span>
      </button>

      <button class="bottom-nav__item cart-nav-item" type="button" data-placeholder-tab="Carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l-1 12H6L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span>Carrito</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>

      <button class="bottom-nav__item" type="button" data-category-jump="combos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11H4z"/><path d="M8 8V5h8v3"/><path d="M9 13h6"/></svg>
        <span>Combos</span>
      </button>

      <button class="bottom-nav__item" type="button" data-placeholder-tab="Ingresar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Ingresar</span>
      </button>
    </nav>
  </div>

  <div id="filterSheet" class="sheet-backdrop" hidden>
    <section class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-heading">
        <h2 id="filterTitle">Filtros</h2>
        <button id="closeFilters" class="sheet-close" type="button" aria-label="Cerrar filtros">×</button>
      </div>

      <fieldset class="filter-group">
        <legend>Precio máximo</legend>
        <div class="price-options">
          <button type="button" class="chip is-selected" data-price="all">Todos</button>
          <button type="button" class="chip" data-price="50000">Hasta $50.000</button>
          <button type="button" class="chip" data-price="100000">Hasta $100.000</button>
          <button type="button" class="chip" data-price="200000">Hasta $200.000</button>
        </div>
      </fieldset>

      <fieldset class="filter-group">
        <legend>Entrega</legend>
        <label class="toggle-row">
          <span>
            <strong>Entrega rápida</strong>
            <small>Hasta 48 h estimadas.</small>
          </span>
          <input id="fastDeliveryFilter" type="checkbox" />
        </label>
      </fieldset>

      <div class="sheet-actions">
        <button id="resetFilters" class="secondary-button" type="button">Restablecer</button>
        <button id="applyFilters" class="primary-button" type="button">Aplicar</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data/catalog.js?v=20260919-1510"></script>
  <script src="js/home.js?v=20260919-1510"></script>
</body>
</html>
